version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      eslint:
        # eslint and its plugins/configs must bump together: @eslint/js@10
        # declares peerOptional eslint@^10.0.0, and a standalone @eslint/js
        # bump (#15) left the repo on eslint@9 with no PR touching eslint
        # itself, so npm ci failed with ERESOLVE and the PR was unmergeable
        # on its own. typescript-eslint@8.69.0 declares
        # peerDependencies.typescript: ">=4.8.4 <6.1.0", so a standalone
        # TypeScript bump breaks npm ci with ERESOLVE too (#22, TypeScript
        # 7.0.2) — grouping typescript here makes them move together.
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-config-*'
          - 'eslint-plugin-*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'typescript'
      vitest:
        # vitest and its companion packages version in lockstep; splitting
        # them risks the same kind of unmergeable mismatch as the eslint
        # group above.
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      - dependency-name: '@types/node'
        # @types/node must track the lowest Node version this package
        # supports, not the newest release — typing against a newer Node
        # than we ship to lets TypeScript accept APIs that don't exist at
        # runtime. Bump by hand when the supported floor moves (#16).
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        # typescript-eslint@8.69.0 (the newest release) declares
        # peerDependencies.typescript: ">=4.8.4 <6.1.0", and no published
        # typescript-eslint accepts TypeScript 7 yet. A major TypeScript
        # bump therefore can't install: it broke npm ci with ERESOLVE both
        # standalone (#22) and grouped with eslint (#25), since the group
        # can't pair TypeScript 7 with a compatible typescript-eslint that
        # doesn't exist. Remove this ignore once typescript-eslint ships
        # support for TypeScript 7 — minor/patch updates within the
        # current major still flow normally.
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        # All of these are first-party actions/* steps pinned by SHA;
        # bumping them one at a time is pure churn, so group everything.
        patterns:
          - '*'
